name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Apple build toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Create Expo project
        run: |
          npx create-expo-app@latest app --template blank@sdk-57 --no-install
          cd app
          cp ../src/App.js ../src/gemini.js ../src/config.js ../src/supabase.js ../src/app.json .
          rm -rf assets && cp -r ../src/assets ./assets
          npm install
          npx expo install expo-image-picker expo-document-picker @react-native-async-storage/async-storage react-native-safe-area-context react-native-screens @expo/vector-icons @supabase/supabase-js react-native-url-polyfill expo-clipboard
          echo "EXPO_PUBLIC_GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Prebuild iOS
        working-directory: app
        run: npx expo prebuild --platform ios

      - name: Build without signing
        working-directory: app/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WS%.xcworkspace}"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: app/ios
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry DuxAI.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: DuxAI-ipa
          path: app/ios/DuxAI.ipa
